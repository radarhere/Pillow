name: Wheels

on:
  schedule:
  #        ┌───────────── minute (0 - 59)
  #        │  ┌───────────── hour (0 - 23)
  #        │  │ ┌───────────── day of the month (1 - 31)
  #        │  │ │ ┌───────────── month (1 - 12 or JAN-DEC)
  #        │  │ │ │ ┌───────────── day of the week (0 - 6 or SUN-SAT)
  #        │  │ │ │ │
  - cron: "42 1 * * 0,3"
  push:
    paths: &paths
      - ".ci/requirements-cibw.txt"
      - ".ci/requirements-sbom.txt"
      - ".github/compare-dist-sizes.py"
      - ".github/dependencies.json"
      - ".github/embed-sbom.py"
      - ".github/generate-sbom.py"
      - ".github/workflows/wheels*"
      - "pyproject.toml"
      - "setup.py"
      - "wheels/*"
      - "winbuild/build_prepare.py"
      - "winbuild/fribidi.cmake"
    tags:
      - "*"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_DISTS: 83
  FORCE_COLOR: 1

jobs:
  sbom:
    if: github.event_name != 'schedule' || github.event.repository.fork == false
    runs-on: ubuntu-latest
    name: Generate SBOM
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.x"

      - name: Generate CycloneDX SBOM
        run: python3 .github/generate-sbom.py

      - name: Validate SBOM
        run: |
          python3 -m pip install -r .ci/requirements-sbom.txt
          check-jsonschema --schemafile "https://raw.githubusercontent.com/CycloneDX/specification/1.7/schema/bom-1.7.schema.json" pillow-*.cdx.json

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sbom
          path: "pillow-*.cdx.json"

  build-native-wheels:
    needs: sbom
    if: github.event_name != 'schedule' || github.event.repository.fork == false
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "manylinux_2_28 x86_64"
            platform: linux
            os: ubuntu-latest
            cibw_arch: x86_64
            build: "*manylinux*"
          - name: "musllinux x86_64"
            platform: linux
            os: ubuntu-latest
            cibw_arch: x86_64
            build: "*musllinux*"
          - name: "manylinux_2_28 aarch64"
            platform: linux
            os: ubuntu-24.04-arm
            cibw_arch: aarch64
            build: "*manylinux*"
          - name: "musllinux aarch64"
            platform: linux
            os: ubuntu-24.04-arm
            cibw_arch: aarch64
            build: "*musllinux*"
